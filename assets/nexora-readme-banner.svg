<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">NEXORA AICTE Approval and Compliance Workspace</title>
  <desc id="description">A connected workspace for applications, document review, EVC visits, and compliance follow-up.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08152d"/>
      <stop offset=".58" stop-color="#102a56"/>
      <stop offset="1" stop-color="#125c69"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#32b8b2"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#32b8b2" stop-opacity=".28"/>
      <stop offset="1" stop-color="#32b8b2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#background)"/>
  <circle cx="1035" cy="96" r="220" fill="url(#glow)"/>
  <circle cx="1150" cy="350" r="200" fill="none" stroke="#a5f3e7" stroke-opacity=".11" stroke-width="1.5"/>
  <circle cx="1150" cy="350" r="154" fill="none" stroke="#a5f3e7" stroke-opacity=".11" stroke-width="1.5"/>
  <path d="M715 0h485v360H840c74-69 99-150 64-226C872 65 812 22 715 0Z" fill="#ffffff" fill-opacity=".025"/>

  <g transform="translate(72 68)">
    <rect width="54" height="54" rx="16" fill="#ffffff" fill-opacity=".1" stroke="#bfdbfe" stroke-opacity=".25"/>
    <path d="M14 39h26M17 35V24m7 11V24m7 11V24m7 11V24M11 20l16-10 16 10H11Z" fill="none" stroke="url(#accent)" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4"/>
  </g>

  <text x="144" y="94" fill="#bfdbfe" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2.8">APPROVAL &amp; COMPLIANCE INTELLIGENCE</text>
  <text x="70" y="184" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="60" font-weight="750" letter-spacing="-2">NEXORA</text>
  <text x="72" y="222" fill="#dbeafe" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="500">A clearer path from application to outcome.</text>
  <text x="72" y="260" fill="#bfdbfe" fill-opacity=".85" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Applications  ·  Documents  ·  EVC visits  ·  Compliance  ·  Insights</text>

  <g transform="translate(72 302)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="650">
    <rect width="146" height="30" rx="15" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".16"/>
    <circle cx="16" cy="15" r="4" fill="#5eead4"/>
    <text x="29" y="19" fill="#e0f2fe">ROLE-AWARE WORKSPACE</text>
    <rect x="158" width="126" height="30" rx="15" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".16"/>
    <circle cx="174" cy="15" r="4" fill="#32b8b2"/>
    <text x="187" y="19" fill="#e0f2fe">AUDITABLE FLOW</text>
    <rect x="296" width="118" height="30" rx="15" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".16"/>
    <circle cx="312" cy="15" r="4" fill="#f3c46b"/>
    <text x="325" y="19" fill="#e0f2fe">DEMO PROTOTYPE</text>
  </g>

  <g transform="translate(780 100)">
    <text x="0" y="0" fill="#bfdbfe" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2">ONE CONNECTED JOURNEY</text>
    <path d="M34 70h280" stroke="#bfdbfe" stroke-opacity=".38" stroke-width="2"/>
    <path d="M34 70h168" stroke="url(#accent)" stroke-width="2.5"/>
    <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" text-anchor="middle">
      <circle cx="34" cy="70" r="14" fill="#0f8f91" stroke="#5eead4" stroke-width="2"/>
      <path d="m28 70 4 4 8-9" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
      <circle cx="127" cy="70" r="14" fill="#0f8f91" stroke="#5eead4" stroke-width="2"/>
      <path d="m121 70 4 4 8-9" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
      <circle cx="220" cy="70" r="14" fill="#102a56" stroke="#9be9df" stroke-opacity=".8" stroke-width="2"/>
      <text x="220" y="74" fill="#dbeafe" font-size="10">3</text>
      <circle cx="314" cy="70" r="14" fill="#102a56" stroke="#9be9df" stroke-opacity=".8" stroke-width="2"/>
      <text x="314" y="74" fill="#dbeafe" font-size="10">4</text>
      <text x="34" y="105" fill="#e0f2fe">Submit</text>
      <text x="127" y="105" fill="#e0f2fe">Review</text>
      <text x="220" y="105" fill="#bfdbfe">Evaluate</text>
      <text x="314" y="105" fill="#bfdbfe">Decide</text>
    </g>
    <rect x="0" y="145" width="348" height="70" rx="16" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".13"/>
    <rect x="18" y="163" width="34" height="34" rx="11" fill="#32b8b2" fill-opacity=".2"/>
    <path d="M27 187v-11l8-6 8 6v11h-6v-7h-5v7Z" fill="none" stroke="#bfdbfe" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"/>
    <text x="68" y="174" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">Built for every team</text>
    <text x="68" y="192" fill="#bfdbfe" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Institutions · Officers · Committees · Admins</text>
  </g>
